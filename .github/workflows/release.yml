name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go run ./cmd/secdoctor-e2e

  release:
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false
      - name: Build desktop application
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          go build -trimpath -ldflags="-s -w" \
            -o "out/SecDoctor-${GOOS}-${GOARCH}${{ matrix.ext }}" \
            ./cmd/secdoctor-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: SecDoctor-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum SecDoctor-* > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: SecDoctor ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v1.0.0-rc2.md
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/SecDoctor-*
            dist/checksums.txt
          generate_release_notes: false
