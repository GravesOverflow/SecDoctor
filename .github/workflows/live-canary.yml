name: SecDoctor live ecosystem canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  npm-live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.9.0"
          package-manager-cache: false
      - name: Docker availability
        run: docker info
      - name: Live npm/registry remediation canary
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: go run ./cmd/secdoctor-live-canary
